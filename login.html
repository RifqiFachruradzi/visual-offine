<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk · Visual Office</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #12141a; --panel: #1b1e27; --line: #2e3342; --text: #e7e9ee; --muted: #9aa1b2; --primary: #4f8cff; --danger: #ef9a9a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { display: grid; place-items: center; padding: 16px;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px; }
    .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand img { width: 44px; height: 44px; }
    h1 { font-size: 18px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: #11131a; color: var(--text); font: inherit; }
    input:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 9px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:disabled { opacity: .6; cursor: wait; }
    svg { width: 16px; height: 16px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; }
    .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">
      <img src="/favicon.svg" alt="" />
      <div><h1>Visual Office</h1><div class="sub">Kantor Agent AI — masuk sebagai Boss</div></div>
    </div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required />
    <button id="b" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      Masuk
    </button>
    <div class="err" id="e" role="alert"></div>
    <div class="foot">Akun diatur lewat environment variable <code>APP_USERNAME</code> &amp; <code>APP_PASSWORD</code>.</div>
  </form>
  <script>
    const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      b.disabled = true; e.textContent = '';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: f.username.value, password: f.password.value }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Gagal masuk (HTTP ' + r.status + ')');
        const next = new URLSearchParams(location.search).get('next');
        location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
      } catch (err) {
        e.textContent = err.message;
        b.disabled = false;
      }
    });
  </script>
</body>
</html>
