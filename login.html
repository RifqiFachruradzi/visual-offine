<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk · Visual Office</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #12141a; --panel: #1b1e27; --panel2: #11131a; --line: #2e3342; --text: #e7e9ee; --muted: #9aa1b2; --primary: #4f8cff; --danger: #ef9a9a; --ok: #81c784; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { display: grid; place-items: center; padding: 16px;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px; }
    .card { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .brand img { width: 44px; height: 44px; }
    h1 { font-size: 18px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 6px; }
    .tabs button { margin: 0; padding: 8px; background: transparent; color: var(--muted); border-radius: 7px; }
    .tabs button.on { background: var(--panel); color: var(--text); }
    label { display: block; color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; }
    input:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 9px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:disabled { opacity: .6; cursor: wait; }
    svg { width: 16px; height: 16px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; }
    .note { color: var(--muted); font-size: 12px; margin-top: 16px; text-align: center; line-height: 1.5; }
    .hidden { display: none !important; }
    code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <form class="card" id="f" novalidate>
    <div class="brand">
      <img src="/favicon.svg" alt="" />
      <div><h1>Visual Office</h1><div class="sub">Kantor Agent AI — kamu adalah Boss-nya</div></div>
    </div>

    <div class="tabs hidden" id="tabs" role="tablist">
      <button type="button" class="on" data-mode="login">Masuk</button>
      <button type="button" data-mode="register">Daftar</button>
    </div>

    <div id="rowName" class="hidden">
      <label for="name">Nama (jadi nama Boss di kantor)</label>
      <input id="name" maxlength="30" autocomplete="nickname" />
    </div>
    <label for="u" id="uLabel">Email</label>
    <input id="u" autocomplete="username" autofocus />
    <label for="p">Kata sandi</label>
    <input id="p" type="password" autocomplete="current-password" />
    <div id="rowCode" class="hidden">
      <label for="code">Kode undangan</label>
      <input id="code" autocomplete="off" />
    </div>

    <button id="b" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      <span id="bText">Masuk</span>
    </button>
    <div class="err" id="e" role="alert"></div>
    <div class="note" id="note"></div>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    let info = { mode: 'db', canRegister: false, codeRequired: false, configured: true };
    let mode = 'login';

    function render() {
      const reg = mode === 'register';
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
      $('rowName').classList.toggle('hidden', !reg);
      $('rowCode').classList.toggle('hidden', !(reg && info.codeRequired));
      $('bText').textContent = reg ? 'Daftar & masuk' : 'Masuk';
      $('p').autocomplete = reg ? 'new-password' : 'current-password';
      $('p').placeholder = reg ? 'Minimal 8 karakter' : '';
      const env = info.mode === 'env';
      $('uLabel').textContent = env ? 'Username' : 'Email';
      $('u').type = env ? 'text' : 'email';
      $('e').textContent = '';
      if (info.canRegister) $('note').textContent = reg ? 'Sudah punya akun? Pilih tab Masuk.' : 'Belum punya akun? Pilih tab Daftar.';
    }

    document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.mode; render(); }));

    fetch('/api/register', { cache: 'no-store' }).then((r) => r.json()).then((j) => {
      info = j;
      $('tabs').classList.toggle('hidden', !j.canRegister);
      if (!j.configured) $('note').innerHTML = 'Login belum dikonfigurasi. Hubungkan <b>Upstash Redis</b> di Vercel → Storage lalu redeploy.';
      else if (j.mode === 'env') $('note').innerHTML = 'Akun diatur lewat environment variable <code>APP_USERNAME</code> &amp; <code>APP_PASSWORD</code>.';
      else if (!j.canRegister) $('note').textContent = 'Pendaftaran akun baru sedang ditutup.';
      else $('note').textContent = 'Belum punya akun? Pilih tab Daftar.';
      render();
    }).catch(() => render());

    $('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const b = $('b'), e = $('e');
      b.disabled = true; e.textContent = '';
      const reg = mode === 'register';
      const body = info.mode === 'env'
        ? { username: $('u').value, password: $('p').value }
        : { email: $('u').value, password: $('p').value, name: $('name').value, code: $('code').value };
      try {
        const r = await fetch(reg ? '/api/register' : '/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Gagal (HTTP ' + r.status + ')');
        const next = new URLSearchParams(location.search).get('next');
        location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
      } catch (err) {
        e.textContent = err.message;
        b.disabled = false;
      }
    });
  </script>
</body>
</html>
